name: Sync from Monday
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync_monday.py
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
      - run: |
          git config user.name "dashboard-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Sync from Monday" && git push)
